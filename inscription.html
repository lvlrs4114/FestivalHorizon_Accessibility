<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Inscription</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="site-header"><div class="brand">Festival Horizon</div><nav class="nav" aria-label="Navigation principale"><a href="index.html">Accueil</a><a href="programme.html">Programme</a><a href="artistes.html">Artistes</a><a href="inscription.html">Inscription</a><a href="contact.html">Contact</a></nav></header>
<main class="container">
  <h1>Inscription</h1>
  <p>Les champs obligatoires sont marqués en rouge.</p>
  <form onsubmit="validateForm(event)">
    <div class="form-row"><input id="name" type="text" placeholder="Nom complet"></div>
    <div class="form-row"><input id="email" type="text" placeholder="Adresse email"><div id="email-error" class="error"></div></div>
    <div class="form-row">
      <label for="arrival">Jour d’arrivée</label>
      <select id="arrival"><option>Vendredi</option><option>Samedi</option></select>
    </div>
    <div class="form-row">
      <div>Mode de transport</div>
      <label><input type="radio" name="transport"> Train</label>
      <label><input type="radio" name="transport"> Voiture</label>
    </div>
    <div class="form-row"><label><input type="checkbox"> J’accepte les conditions</label></div>
    <button class="button" type="submit">OK</button>
  </form>
</main>
<script src="js/app.js"></script>
</body>
</html>
